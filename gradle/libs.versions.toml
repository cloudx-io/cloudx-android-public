[versions]
# === Android Build Configuration ===
compileSdk = "36"
targetSdk = "36"
kotlinJvmTarget = "1.8"

# === Build Tools ===
gradle = "8.13.2"

# === Kotlin & Coroutines ===
kotlin = "2.2.21"
coroutines = "1.10.2"

# === AndroidX Core ===
core-ktx = "1.12.0"
appcompat = "1.6.1"
material = "1.11.0"
constraintlayout = "2.1.4"
lifecycle = "2.7.0"

# === CloudX ===
# The SDK and adapter set from the Android integration docs; "+" resolves the newest release.
cloudx = "+"
# adapter-magnite 3.2.0 predates the current 1.x line and sorts above it, so "+" would pick it.
cloudxAdapterMagnite = "1.+"

# === Consent ===
googleUmp = "3.1.0"

[libraries]
# === CloudX SDK And Adapters ===
cloudx-sdk = { module = "io.cloudx:sdk", version.ref = "cloudx" }
cloudx-adapter-applovin = { module = "io.cloudx:adapter-applovin", version.ref = "cloudx" }
cloudx-adapter-bigo = { module = "io.cloudx:adapter-bigo", version.ref = "cloudx" }
cloudx-adapter-digitalturbine = { module = "io.cloudx:adapter-digitalturbine", version.ref = "cloudx" }
cloudx-adapter-googlewaterfall = { module = "io.cloudx:adapter-googlewaterfall", version.ref = "cloudx" }
cloudx-adapter-inmobi = { module = "io.cloudx:adapter-inmobi", version.ref = "cloudx" }
cloudx-adapter-magnite = { module = "io.cloudx:adapter-magnite", version.ref = "cloudxAdapterMagnite" }
cloudx-adapter-meta = { module = "io.cloudx:adapter-meta", version.ref = "cloudx" }
cloudx-adapter-mintegral = { module = "io.cloudx:adapter-mintegral", version.ref = "cloudx" }
cloudx-adapter-mobilefuse = { module = "io.cloudx:adapter-mobilefuse", version.ref = "cloudx" }
cloudx-adapter-moloco = { module = "io.cloudx:adapter-moloco", version.ref = "cloudx" }
cloudx-adapter-pangle = { module = "io.cloudx:adapter-pangle", version.ref = "cloudx" }
cloudx-adapter-taurusx = { module = "io.cloudx:adapter-taurusx", version.ref = "cloudx" }
cloudx-adapter-unityads = { module = "io.cloudx:adapter-unityads", version.ref = "cloudx" }
cloudx-adapter-verve = { module = "io.cloudx:adapter-verve", version.ref = "cloudx" }
cloudx-adapter-vungle = { module = "io.cloudx:adapter-vungle", version.ref = "cloudx" }

# === Kotlin & Coroutines ===
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# === AndroidX Core ===
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# === AndroidX UI Components ===
fragment-ktx = "androidx.fragment:fragment-ktx:1.7.1"
recyclerview = "androidx.recyclerview:recyclerview:1.3.2"

# === AndroidX Lifecycle ===
lifecycle-runtime = {  group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# === Consent ===
google-ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "googleUmp" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "gradle" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
